<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multi-Agent Auto-Scheduling Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62.5..125,300..800&display=swap" rel="stylesheet" />
    <script>
      // Paint the board ground before first paint, or a dark-mode reload
      // flashes the light surface for a frame.
      try {
        var d = localStorage.getItem('om_mode') === 'dark';
        document.documentElement.style.background = d ? '#101315' : '#e7e4dc';
        document.documentElement.style.colorScheme = d ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
