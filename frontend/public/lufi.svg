<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Lufi — AI market analyst">
  <defs>
    <linearGradient id="lufiBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <clipPath id="lufiClip"><circle cx="48" cy="48" r="48"/></clipPath>
  </defs>
  <g clip-path="url(#lufiClip)">
    <rect width="96" height="96" fill="url(#lufiBg)"/>
    <!-- hair (back) -->
    <path d="M22 54c0-19 11-32 26-32s26 13 26 32v42H22z" fill="#3b2a4d"/>
    <!-- neck + shoulders -->
    <rect x="41" y="60" width="14" height="16" rx="6" fill="#f0c4a0"/>
    <path d="M26 96c2-12 11-20 22-20s20 8 22 20z" fill="#1f2937"/>
    <!-- face -->
    <ellipse cx="48" cy="47" rx="17.5" ry="19.5" fill="#f6d2b2"/>
    <!-- fringe -->
    <path d="M30 42c0-15 8-23 18-23s18 8 18 21c-6-8-12-10-18-10s-13 4-18 12z" fill="#2e2138"/>
    <!-- artist beret -->
    <path d="M29 30c4-9 15-13 23-9 7 3 10 9 8 14-3-4-26-7-31-5z" fill="#e5484d"/>
    <circle cx="61" cy="25.5" r="2.6" fill="#e5484d"/>
    <!-- eyes -->
    <circle cx="42" cy="47" r="2.2" fill="#2e2138"/>
    <circle cx="54" cy="47" r="2.2" fill="#2e2138"/>
    <path d="M38.5 43.5c1.5-1.4 4-1.6 5.6-.4M51.9 43.1c1.6-1.2 4.1-1 5.6.4" fill="none" stroke="#2e2138" stroke-width="1.4" stroke-linecap="round"/>
    <!-- blush -->
    <circle cx="38" cy="53" r="3" fill="#f6a6b2" opacity="0.55"/>
    <circle cx="58" cy="53" r="3" fill="#f6a6b2" opacity="0.55"/>
    <!-- smile -->
    <path d="M43 55c3 3 7 3 10 0" fill="none" stroke="#9b5d4a" stroke-width="2" stroke-linecap="round"/>
    <!-- floating market chart she's reading -->
    <g transform="translate(8,64)">
      <rect x="0" y="0" width="28" height="21" rx="4.5" fill="#ffffff" opacity="0.94"/>
      <polyline points="3,16 8,10 13,13 18,5 24,8" fill="none" stroke="#16a34a" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="24" cy="8" r="1.8" fill="#16a34a"/>
    </g>
  </g>
  <circle cx="48" cy="48" r="47" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2"/>
</svg>
